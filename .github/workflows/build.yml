name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/selvakumar/jothida
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF_X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "JothidaApp"
          include ':app'
          EOF_X
          cat > build.gradle <<'EOF_X'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_X
          cat > gradle.properties <<'EOF_X'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_X
          cat > app/build.gradle <<'EOF_X'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.selvakumar.jothida'
              compileSdk 34
              defaultConfig {
                  applicationId "com.selvakumar.jothida"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF_X
          cat > app/src/main/AndroidManifest.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <application
                  android:label="செல்வக்குமார் ஜோதிடம்"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_X
          cat > app/src/main/java/com/selvakumar/jothida/MainActivity.java <<'EOF_X'
          package com.selvakumar.jothida;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> chooser;
              private static final int REQ_FILE = 11;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (chooser != null) chooser.onReceiveValue(null);
                          chooser = cb;
                          try {
                              startActivityForResult(p.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              chooser = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "AndroidSave");
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && chooser != null) {
                      chooser.onReceiveValue(android.webkit.WebChromeClient.FileChooserParams.parseResult(res, data));
                      chooser = null;
                  } else super.onActivityResult(req, res, data);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              class Bridge {
                  @JavascriptInterface
                  public void savePdf(String b64, String name) {
                      try {
                          byte[] data = Base64.decode(b64, Base64.DEFAULT);
                          Uri uri;
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                              v.put(MediaStore.Downloads.MIME_TYPE, "application/pdf");
                              v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              try (OutputStream o = getContentResolver().openOutputStream(uri)) { o.write(data); }
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              dir.mkdirs();
                              File f = new File(dir, name);
                              try (FileOutputStream o = new FileOutputStream(f)) { o.write(data); }
                              uri = Uri.fromFile(f);
                          }
                          final Uri u = uri;
                          runOnUiThread(() -> {
                              Toast.makeText(MainActivity.this, "PDF சேமிக்கப்பட்டது: Downloads/" + name, Toast.LENGTH_LONG).show();
                              try {
                                  Intent i = new Intent(Intent.ACTION_VIEW);
                                  i.setDataAndType(u, "application/pdf");
                                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                              } catch (Exception e) { /* no PDF viewer: file is still in Downloads */ }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "சேமிக்க முடியவில்லை: " + e, Toast.LENGTH_LONG).show());
                      }
                  }
              }
          }
          EOF_X
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jothida-APK
          path: app/build/outputs/apk/debug/app-debug.apk
